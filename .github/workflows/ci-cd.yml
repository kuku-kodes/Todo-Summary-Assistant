
name: TodoSummaryAssistant CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend/todo-summary-assistant

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode -DskipTests package

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend/todo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/todo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          CI: true
          REACT_APP_API_BASE_URL: http://localhost:8080/api/todos
        run: npm run build

  docker-publish:
    name: Build and Push Images to Amazon ECR
    needs: [backend-build, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/todo-summary-assistant
          push: true
          tags: |
            119826412565.dkr.ecr.ap-south-1.amazonaws.com/todo-summary-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend/todo
          push: true
          build-args: |
            REACT_APP_API_BASE_URL=${{ vars.REACT_APP_API_BASE_URL }}
          tags: |
            119826412565.dkr.ecr.ap-south-1.amazonaws.com/todo-summary-frontend:${{ github.sha }}
    
  deploy-ec2:
    name: Deploy to EC2
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-south-1
      AWS_ACCOUNT_ID: "119826412565"
      EC2_INSTANCE_ID: "i-016f6c8860d0dcedc"
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy containers through SSM
        shell: bash
        run: |
          set -euo pipefail

          BACKEND_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/todo-summary-backend:${IMAGE_TAG}"
          FRONTEND_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/todo-summary-frontend:${IMAGE_TAG}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Todo Summary Assistant ${IMAGE_TAG}" \
            --parameters "$(jq -nc \
              --arg backend "$BACKEND_IMAGE" \
              --arg frontend "$FRONTEND_IMAGE" \
              --arg region "$AWS_REGION" \
              --arg account "$AWS_ACCOUNT_ID" \
              '{
                commands: [
                  "set -eu",
                  ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $account + ".dkr.ecr." + $region + ".amazonaws.com"),
                  ("docker pull " + $backend),
                  ("docker pull " + $frontend),
                  "test -f /opt/todo-assistant/backend.env",
                  "docker network inspect todo-app-network >/dev/null",
                  "docker rm -f backend frontend 2>/dev/null || true",
                  ("docker run -d --name backend --network todo-app-network --restart unless-stopped --env-file /opt/todo-assistant/backend.env " + $backend),
                  ("docker run -d --name frontend --network todo-app-network --restart unless-stopped -p 80:80 " + $frontend),
                  "sleep 10",
                  "docker ps --filter name=backend --filter name=frontend",
                  "docker logs --tail 50 backend"
                ]
              }')" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment commands completed."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment is still running. Check the SSM command in AWS Systems Manager."
          exit 1