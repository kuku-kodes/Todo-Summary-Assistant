
name: TodoSummaryAssistant CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend/todo-summary-assistant

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode -DskipTests package

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend/todo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/todo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          CI: true
          REACT_APP_API_BASE_URL: http://localhost:8080/api/todos
        run: npm run build
